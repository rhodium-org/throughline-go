uid: SR-0030
type: system_requirement
status: approved
title: Do not capitalise or punctuate error strings
text: >-
  Write error strings without a leading capital (unless they begin with an exported name
  or proper noun) and without trailing punctuation, since they are often wrapped in more
  context.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "Google Go Style Guide: Errors — Error Strings"
