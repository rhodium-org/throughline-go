uid: SR-0015
type: system_requirement
status: approved
title: Avoid Get prefixes on getters
text: >-
  Do not prefix a getter with Get or get unless the underlying concept genuinely uses the
  word get; name it after the noun, or use Compute or Fetch when real work is done.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "Google Go Style Guide: Naming — Getters"
