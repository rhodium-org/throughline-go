uid: SR-0064
type: system_requirement
status: approved
title: Compare with cmp.Equal and cmp.Diff
text: >-
  Use cmp.Equal for equality and cmp.Diff for a human-readable diff, in preference to
  reflect.DeepEqual or older pretty-printing libraries.
links:
