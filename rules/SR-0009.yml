uid: SR-0009
type: system_requirement
status: proposed
title: Use MixedCaps, not underscores
text: Use MixedCaps or mixedCaps for multi-word names rather than underscores, even
  for constants; capitalise the first letter only to export.
normative: true
links:
- target: UR-0002
  type: implements
