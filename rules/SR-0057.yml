uid: SR-0057
type: system_requirement
status: proposed
title: Use the standard logging package appropriately
text: Use the standard log package, prefer its non-formatting call when no formatting
  is needed, and use log.Fatal for an abnormal exit with a stack trace.
normative: true
links:
