uid: SR-0029
type: system_requirement
status: proposed
title: Return errors as the final result
text: Return an error as the final return value, using the error interface type rather
  than a concrete type, and return nil to signal success.
normative: true
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: 'Google Go Style Guide: Errors — Returning Errors'
