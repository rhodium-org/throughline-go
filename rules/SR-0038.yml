uid: SR-0038
type: system_requirement
status: approved
title: Use generics only to meet a real requirement
text: >-
  Use generics to satisfy a genuine business requirement, not prematurely, and avoid
  building DSLs, assertion libraries or over-engineered abstractions with them.
links:
- target: UR-0006
  type: implements
attrs:
  source_ref: "Google Go Style Guide: Language Features — Generics"
