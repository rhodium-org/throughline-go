uid: SR-0017
type: system_requirement
status: proposed
title: Reserve single-letter names for small scopes
text: Use a single-letter name only for a method receiver, a familiar type such as
  r for an io.Reader, a loop index, or another short-scope abbreviation.
normative: true
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: 'Google Go Style Guide: Naming — Single-letter Variable Names'
