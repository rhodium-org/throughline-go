uid: SR-0039
type: system_requirement
status: approved
title: Pass small values, point at large ones
text: >-
  Do not pass a pointer merely to save the bytes of a string or small value; use a pointer
  for a large struct or a protocol buffer.
links:
- target: UR-0006
  type: implements
attrs:
  source_ref: "Google Go Style Guide: Language Features — Pass Values"
