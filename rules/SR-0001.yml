uid: SR-0001
type: system_requirement
status: approved
title: Make the code's purpose and rationale clear
text: >-
  Write for the reader: make both what the code does and why it does it clear, through
  effective naming, helpful commentary and sensible organisation. Clarity is the most
  important principle.
