uid: SR-0025
type: system_requirement
status: proposed
title: Do not rename imports without cause
text: Do not rename an import unless necessary; when renaming is required follow
  the package naming rules, and rename a generated protocol-buffer package to strip
  underscores with a pb suffix.
normative: true
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: 'Google Go Style Guide: Imports — Import Renaming'
