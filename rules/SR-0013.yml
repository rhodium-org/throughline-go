uid: SR-0013
type: system_requirement
status: proposed
title: Name constants in MixedCaps by role
text: Name constants in MixedCaps like every other Go name — not ALL_CAPS or a K
  prefix — and describe the constant's role rather than its value.
normative: true
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: 'Google Go Style Guide: Naming — Constant Names'
